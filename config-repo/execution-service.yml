server:
  port: 8082

spring:
  application:
    name: execution-service
  datasource:
    url: jdbc:h2:mem:execution_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

ewb:
  scheduler:
    lease-duration-seconds: 60
    polling-interval-ms: 5000
